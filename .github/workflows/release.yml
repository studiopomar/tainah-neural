name: Build Tainah Neural releases

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            archive: tainah-neural-${{ github.ref_name }}-windows-x64.zip
            executable: target/release/tainah-neural.exe
          - name: macOS Apple Silicon
            runner: macos-15
            archive: tainah-neural-${{ github.ref_name }}-macos-arm64.tar.gz
            executable: target/release/tainah-neural
          - name: macOS Intel
            runner: macos-15-intel
            archive: tainah-neural-${{ github.ref_name }}-macos-x64.tar.gz
            executable: target/release/tainah-neural
          - name: Linux x64
            runner: ubuntu-latest
            archive: tainah-neural-${{ github.ref_name }}-linux-x64.tar.gz
            executable: target/release/tainah-neural
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/checkout@v4
        with:
          repository: studiopomar/kamafeu
          path: engine-source
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Build Tainah WORLD native library
        run: python3 engine-source/native/tainah/build.py
      - name: Build helper
        run: cargo build --release --locked --bin tainah-neural
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item "${{ matrix.executable }}","README.md","LICENSE","engine-source/target/tainah-package/tainah_motor.dll","engine-source/target/tainah-package/licenca-da-base-LGPL-3.0.txt" package/
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.archive }}"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p package
          cp "${{ matrix.executable }}" README.md LICENSE engine-source/target/tainah-package/libtainah_motor.dylib engine-source/target/tainah-package/licenca-da-base-LGPL-3.0.txt package/
          tar -czf "${{ matrix.archive }}" -C package .
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p package
          cp "${{ matrix.executable }}" README.md LICENSE engine-source/target/tainah-package/libtainah_motor.so.1 engine-source/target/tainah-package/licenca-da-base-LGPL-3.0.txt package/
          tar -czf "${{ matrix.archive }}" -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
